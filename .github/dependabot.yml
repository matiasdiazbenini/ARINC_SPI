---
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: pip
    directory: /HOST_3b+
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
      - raspberry-pi
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: pip
    directory: /DASHBOARD_WEB/arinc_dashboard
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
      - dashboard
    commit-message:
      prefix: deps
      include: scope
