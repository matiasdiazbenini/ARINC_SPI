<rect x="50" y="50" width="1130" height="710" fill="#ffffff" stroke="#111827" stroke-width="4"/>
<text x="80" y="90" font-family="Arial" font-size="26" font-weight="700" fill="#111827">PCB preliminar front-end electrico ARINC 429 de laboratorio</text>
<text x="80" y="120" font-family="Arial" font-size="16" fill="#334155">Distribucion inicial: conectores en bordes, TX bipolar separado de RX protegido, testpoints cerca de J2.</text>
<line x1="120.0" y1="220.0" x2="420.0" y2="340.0" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/><text x="270.0" y="274.0" text-anchor="middle" font-family="Arial" font-size="12" fill="#16a34a">TX_A/TX_B</text><line x1="420.0" y1="340.0" x2="1000.0" y2="240.0" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/><text x="710.0" y="284.0" text-anchor="middle" font-family="Arial" font-size="12" fill="#16a34a">LINE_A/B</text><line x1="1000.0" y1="240.0" x2="800.0" y2="420.0" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/><text x="900.0" y="324.0" text-anchor="middle" font-family="Arial" font-size="12" fill="#16a34a">sense</text><line x1="800.0" y1="420.0" x2="120.0" y2="280.0" stroke="#f97316" stroke-width="4" marker-end="url(#arrow)"/><text x="460.0" y="344.0" text-anchor="middle" font-family="Arial" font-size="12" fill="#f97316">RX_A/RX_B</text><line x1="420.0" y1="100.0" x2="420.0" y2="340.0" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/><text x="420.0" y="214.0" text-anchor="middle" font-family="Arial" font-size="12" fill="#dc2626">+/-6V</text><line x1="420.0" y1="100.0" x2="800.0" y2="420.0" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/><text x="610.0" y="254.0" text-anchor="middle" font-family="Arial" font-size="12" fill="#dc2626">+3V3/GND</text>
<rect x="50.0" y="110.0" width="140.0" height="220.0" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="120.0" y="220.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#0f172a">Pico I/O</text><rect x="310.0" y="50.0" width="220.0" height="100.0" rx="6" fill="#fee2e2" stroke="#334155" stroke-width="2"/><text x="420.0" y="100.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#0f172a">Fuentes</text><rect x="310.0" y="230.0" width="220.0" height="220.0" rx="6" fill="#fff7ed" stroke="#334155" stroke-width="2"/><text x="420.0" y="340.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#0f172a">U1 TX bipolar</text><rect x="900.0" y="180.0" width="200.0" height="120.0" rx="6" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="1000.0" y="240.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#0f172a">Linea A/B</text><rect x="690.0" y="310.0" width="220.0" height="220.0" rx="6" fill="#eff6ff" stroke="#334155" stroke-width="2"/><text x="800.0" y="420.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#0f172a">U2 RX comp.</text><rect x="340.0" y="310.0" width="600.0" height="380.0" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="640.0" y="500.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#0f172a">Pasivos, clamps y testpoints</text>
<text x="80" y="720" font-family="Arial" font-size="15" fill="#475569">Nota: no es PCB final de campo. Usa DIP8/THT para banco, validacion y reemplazo facil de componentes.</text>
