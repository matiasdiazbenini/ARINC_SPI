global:
  scrape_interval: 1s
  evaluation_interval: 1s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "prometheus"
    scrape_interval: 1s
    scrape_timeout: 800ms
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"

  - job_name: "arinc_dashboard"
    scrape_interval: 1s
    scrape_timeout: 800ms
    metrics_path: /metrics
    static_configs:
      - targets: ["192.168.50.2:5000"]
        labels:
          app: "arinc-dashboard"
          host: "rpi3bplus"