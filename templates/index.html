<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Sniffer MIL-STD-1553</title>
  <style>
    :root {
      --bg: #edf2f7;
      --surface: #ffffff;
      --ink: #1a202c;
      --muted: #64748b;
      --border: #dbe4ee;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --ok: #166534;
      --ok-soft: #dcfce7;
      --danger: #b91c1c;
      --danger-soft: #fee2e2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background:
        radial-gradient(circle at top left, #d8f3dc 0, transparent 26%),
        radial-gradient(circle at top right, #bfdbfe 0, transparent 24%),
        var(--bg);
      color: var(--ink);
    }

    .page {
      max-width: 1300px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero {
      background: linear-gradient(135deg, #0f172a, #164e63);
      color: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .hero p {
      margin: 0;
      color: #dbeafe;
      line-height: 1.5;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: var(--shadow);
      margin-top: 18px;
    }

    .controls-grid,
    .stats-grid {
      display: grid;
      gap: 16px;
    }

    .controls-grid {
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      align-items: end;
    }

    .stats-grid {
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, select, button {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 11px 12px;
      font-size: 14px;
      background: white;
    }

    button {
      cursor: pointer;
      background: #f8fafc;
      font-weight: 600;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: #eef2ff;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .actions button {
      width: auto;
      min-width: 140px;
    }

    .stat-box {
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--border);
    }

    .stat-box.ok {
      background: var(--ok-soft);
    }

    .stat-box.err {
      background: var(--danger-soft);
    }

    .stat-title {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 30px;
      font-weight: 700;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      border-bottom: 1px solid var(--border);
      text-align: left;
      padding: 10px 8px;
      vertical-align: top;
    }

    th {
      background: #f8fafc;
      color: #475569;
      position: sticky;
      top: 0;
    }

    .mono {
      font-family: Consolas, monospace;
      white-space: nowrap;
    }

    .tag {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .tag-ok {
      background: var(--ok-soft);
      color: var(--ok);
    }

    .tag-err {
      background: var(--danger-soft);
      color: var(--danger);
    }

    #console {
      min-height: 260px;
      max-height: 460px;
      overflow-y: auto;
      border-radius: 16px;
      padding: 16px;
      background: #0b1220;
      color: #dcfce7;
      font-family: Consolas, monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <h1>Sniffer Logico MIL-STD-1553</h1>
      <p>
        Vista simplificada para tramas minimas del sniffer: RX_OK / RX_ERR con WORD y PARITY.
        Pensado para validacion rapida en banco y consumo posterior desde Flask.
      </p>
    </section>

    <section class="card">
      <div class="controls-grid">
        <div>
          <label for="port">Puerto</label>
          <select id="port">
            {% for p in ports %}
              <option value="{{ p }}">{{ p }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label for="baudrate">Baudrate</label>
          <input id="baudrate" type="number" value="{{ baudrate }}">
        </div>

        <div>
          <label for="filter_text">Filtro de consola/log</label>
          <input id="filter_text" type="text" value="{{ filter_text }}" placeholder="Ej: RX_OK,RX_ERR,PARITY=ERR">
        </div>
      </div>

      <div class="actions">
        <button onclick="startCapture()">Iniciar captura</button>
        <button onclick="stopCapture()">Detener captura</button>
        <button onclick="clearConsole()">Limpiar buffers</button>
        <button onclick="refreshPorts()">Actualizar puertos</button>
      </div>
    </section>

    <section class="stats-grid">
      <div class="stat-box ok">
        <div class="stat-title">Frames validos</div>
        <div class="stat-value" id="stat-valid">0</div>
      </div>
      <div class="stat-box err">
        <div class="stat-title">Frames invalidos</div>
        <div class="stat-value" id="stat-invalid">0</div>
      </div>
    </section>

    <section class="card">
      <h3>Frames recientes</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Hora</th>
              <th>Evento</th>
              <th>Palabra</th>
              <th>Paridad</th>
              <th>Linea cruda</th>
            </tr>
          </thead>
          <tbody id="frames-body"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h3>Consola serial</h3>
      <div id="console"></div>
    </section>
  </div>

  <script>
    const consoleDiv = document.getElementById("console");
    const framesBody = document.getElementById("frames-body");

    async function refreshConsole() {
      try {
        const response = await fetch("/lines");
        const data = await response.json();
        consoleDiv.textContent = data.text;
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
      } catch (err) {
      }
    }

    async function refreshFrames() {
      try {
        const response = await fetch("/frames");
        const data = await response.json();
        framesBody.innerHTML = "";

        for (const frame of data.frames.slice().reverse()) {
          const tr = document.createElement("tr");
          const eventClass = frame.event === "RX_OK" ? "tag tag-ok" : "tag tag-err";

          tr.innerHTML = `
            <td>${frame.timestamp}</td>
            <td><span class="${eventClass}">${frame.event}</span></td>
            <td class="mono">${frame.word}</td>
            <td>${frame.parity}</td>
            <td class="mono">${frame.raw}</td>
          `;

          framesBody.appendChild(tr);
        }
      } catch (err) {
      }
    }

    async function refreshStats() {
      try {
        const response = await fetch("/stats");
        const data = await response.json();
        document.getElementById("stat-valid").textContent = data.valid_frames;
        document.getElementById("stat-invalid").textContent = data.invalid_frames;
      } catch (err) {
      }
    }

    async function startCapture() {
      const form = new FormData();
      form.append("port", document.getElementById("port").value);
      form.append("baudrate", document.getElementById("baudrate").value);
      form.append("filter_text", document.getElementById("filter_text").value);

      const response = await fetch("/start", {
        method: "POST",
        body: form
      });
      const data = await response.json();
      alert(data.msg);
    }

    async function stopCapture() {
      const response = await fetch("/stop", { method: "POST" });
      const data = await response.json();
      alert(data.msg);
    }

    async function clearConsole() {
      await fetch("/clear", { method: "POST" });
      refreshAll();
    }

    async function refreshPorts() {
      const response = await fetch("/ports");
      const data = await response.json();

      const select = document.getElementById("port");
      select.innerHTML = "";

      for (const port of data.ports) {
        const option = document.createElement("option");
        option.value = port;
        option.textContent = port;
        select.appendChild(option);
      }
    }

    function refreshAll() {
      refreshConsole();
      refreshFrames();
      refreshStats();
    }

    setInterval(refreshAll, 500);
    refreshAll();
  </script>
</body>
</html>
